[package]
name = "rust-agent-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fastembed = "5"
dotenvy = "0.15"
pdf-extract = "0.7"
csv = "1.3"
pulldown-cmark = "0.10"
sha2 = "0.10"
bincode = "1.3"



[[bin]]
name = "rust-agent-core"
path = "src/main.rs"


