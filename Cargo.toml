[package]
name = "rust-rag-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fastembed = "5"
dotenvy = "0.15"


[[bin]]
name = "rust-rag-agent"
path = "src/main.rs"


